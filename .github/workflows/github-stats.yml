name: Update Terminal Stats Card

on:
  schedule:
    # Daily at 02:47 UTC. Change this if you want a different time.
    - cron: '47 2 * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # needed so the bot can commit the SVG back

jobs:
  build-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Generate SVG Terminal Stats Card
        uses: yogeshwaran01/github-stats-terminal-style@master
        with:
          username: ${{ github.repository_owner }}
          # token: ${{ secrets.GHT }}   # uncomment if you add a classic PAT secret
          theme: tokyonight
          headerStyle: mac
          hostname: github.com
          typingSpeed: 80
          commands: whoami,neofetch,languages,top-repos,uptime,exit
          outputPath: assets/github_stats.svg

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github_stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update terminal stats card [skip ci]" && git push)
