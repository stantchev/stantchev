name: Terminal Stats Card

on:
  schedule:
    - cron: '47 2 * * *'   # daily at 02:47 UTC
  workflow_dispatch:        # run manually from the Actions tab
  push:
    paths:
      - '.github-stats-config.json'
      - 'scripts/terminal-stats.js'
      - '.github/workflows/terminal-stats.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/terminal-stats.js --user ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github_stats.svg
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update terminal stats card [skip ci]"
            git push
          fi
